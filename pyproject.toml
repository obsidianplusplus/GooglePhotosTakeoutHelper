[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "google-photos-takeout-helper"
dynamic = ["version"]
description = "整理 Google Photos Takeout 照片、视频、日期与相册的跨平台工具"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Google Photos Takeout Helper contributors" },
]
keywords = ["google-photos", "takeout", "photo", "metadata", "album"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: System :: Archiving",
]
dependencies = [
  "customtkinter>=5.2.2,<6",
  "Pillow>=10.0,<13",
]

[project.urls]
Homepage = "https://github.com/TheLastGimbus/GooglePhotosTakeoutHelper"
Issues = "https://github.com/TheLastGimbus/GooglePhotosTakeoutHelper/issues"

[project.scripts]
gpth = "gpth.cli:main"

[project.gui-scripts]
gpth-gui = "gpth.cli:launch_gui"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pyinstaller>=6.10",
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[tool.setuptools.dynamic]
version = { attr = "gpth.__version__" }

[tool.setuptools.packages.find]
include = ["gpth*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "customtkinter"
ignore_missing_imports = true
